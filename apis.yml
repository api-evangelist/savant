aid: savant
name: Savant
description: >-
  Savant (heysavant.com) is a Y Combinator (Spring 2026) startup building an
  operational memory layer for AI-native enterprises. It integrates with
  existing company tools such as Slack, Salesforce, and Google Workspace to
  capture both documented and undocumented operational knowledge, including
  procedures, exceptions, judgment calls, and edge cases, then structures that
  knowledge and serves it to employees and AI agents at critical decision
  moments. Founded in 2026 in San Francisco by Anthony Kim (CEO) and Kevin Yu
  (CTO), Savant positions itself as the company brain that every AI-native
  enterprise runs on. As of this profile the company publishes a marketing
  site, product guides, a changelog, a status page, and support and legal
  pages, but exposes no public developer API, SDK, or API reference surface.
